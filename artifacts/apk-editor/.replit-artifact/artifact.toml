kind = "web"
previewPath = "/"
title = "APK Editor"
version = "1.0.0"
id = "artifacts/apk-editor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18916

[services.development]
run = "pnpm --filter @workspace/apk-editor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apk-editor", "run", "build" ]
publicDir = "artifacts/apk-editor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18916"
BASE_PATH = "/"
